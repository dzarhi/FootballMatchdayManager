name: Sync league and deploy site

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'data/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/site.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: football-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Sync final results and standings
        if: github.event_name != 'push'
        run: npm run sync:vole
      - name: Save validated data
        if: github.event_name != 'push'
        run: |
          git add data/league.json data/matches.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update Vole league results and standings'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir public
          cp *.html public/
          cp -R assets css js data public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4