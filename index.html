<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מ.ס. אשדוד - ילדים ב' | לוח משחקים</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <button id="theme-toggle" class="theme-toggle" aria-label="החלף מצב תצוגה">🌙</button>
    <button id="refresh-btn" class="refresh-btn" aria-label="רענן נתונים">🔄</button>
    <div class="header-content">
      <img src="assets/logo.png" alt="סמל מ.ס. אשדוד" class="team-logo">
      <div class="header-text">
        <h1>מ.ס. אשדוד 2026/27</h1>
        <p class="subtitle">ילדים ב' &middot; לוח משחקים</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section>
      <div class="filter-bar" id="type-filter" role="group" aria-label="סינון לפי סוג משחק">
        <button type="button" class="filter-chip" data-type="league">ליגה</button>
        <button type="button" class="filter-chip" data-type="cup">גביע</button>
        <button type="button" class="filter-chip" data-type="training">אימון</button>
      </div>
    </section>

    <section>
      <h2 class="section-title">משחקים קרובים</h2>
      <div id="upcoming-matches" class="matches-grid"></div>
    </section>

    <section>
      <button id="toggle-past" class="toggle-btn">הצג משחקים קודמים</button>
      <div id="past-matches" class="matches-grid hidden"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>מ.ס. אשדוד - ילדים ב'</p>
    <p class="credit">Developed by Danny Zarhi</p>
  </footer>

  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
